name: Sync clean question bank
on:
  push:
    branches: [r60-preview]
    paths: [.github/workflows/sync-questions.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r60-preview
      - name: Copy original questions and clean bank
        run: |
          curl -fsSL "https://raw.githubusercontent.com/EudomarC/Reto-60/r60-games-integration/questions.js" -o questions.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('questions.js'); s=p.read_text()
          pat=re.compile(r'(¿Cuánto es (\d+) × 10\?","a":\["\d+","\d+","(\d+)",")\3("\],"c":1)')
          def fix(m):
              n=int(re.search(r'¿Cuánto es (\d+) × 10',m.group(1)).group(1)); d=int(m.group(3))
              return m.group(1)+str(d+n)+m.group(4)
          s,n=pat.subn(fix,s)
          if n != 10: raise SystemExit(f'Expected 10 x10 fixes, got {n}')
          p.write_text(s)
          PY
      - name: Clean, add Gamer pack and validate
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('questions.js','utf8').replace('const questions =','globalThis.questions =');
          const ctx={}; vm.createContext(ctx); vm.runInContext(src,ctx);
          const seen=new Set(), clean=[], removed=[];
          for(const q of ctx.questions){const k=q.q.trim().toLowerCase(); if(seen.has(k)){removed.push(q.q);continue;} seen.add(k);clean.push(q);}
          if(removed.length!==1) throw new Error(`Expected 1 original duplicate, found ${removed.length}`);
          const gamer=[
            {q:'En Minecraft, ¿qué criatura verde puede explotar cerca del jugador?',a:['Creeper','Enderman','Aldeano','Esqueleto'],c:0,category:'gaming'},
            {q:'En Minecraft, ¿qué material se necesita para fabricar una mesa de encantamientos?',a:['Diamante','Cobre','Hierro','Carbón'],c:0,category:'gaming'},
            {q:'¿Cómo se llama la dimensión de Minecraft a la que se entra normalmente mediante un portal de obsidiana?',a:['El Nether','El Océano','La Jungla','La Aldea'],c:0,category:'gaming'},
            {q:'En Minecraft, ¿qué criatura alta y oscura puede teletransportarse?',a:['Enderman','Creeper','Zombi','Araña'],c:0,category:'gaming'},
            {q:'En Minecraft, ¿qué herramienta se usa principalmente para extraer piedra y minerales?',a:['Pico','Pala','Azada','Caña de pescar'],c:0,category:'gaming'},
            {q:'En Minecraft, ¿qué objeto permite dormir y fijar un punto de reaparición en el mundo normal?',a:['Cama','Cofre','Horno','Yunque'],c:0,category:'gaming'},
            {q:'¿Cómo se llama la moneda virtual utilizada en Roblox?',a:['Robux','Minecoins','Rings','Gemas'],c:0,category:'gaming'},
            {q:'En Roblox, ¿cómo se llaman los mundos o juegos creados por la comunidad dentro de la plataforma?',a:['Experiencias','Capítulos','Cartuchos','Discos'],c:0,category:'gaming'},
            {q:'¿Cuál de estos nombres corresponde a una experiencia conocida de Roblox?',a:['Brookhaven RP','The Nether','Green Hill Zone','Hyrule Field'],c:0,category:'gaming'},
            {q:'¿Cuál de estas experiencias de Roblox está relacionada con cuidar y coleccionar mascotas?',a:['Adopt Me!','Doors','Arsenal','Tower of Hell'],c:0,category:'gaming'},
            {q:'¿Cuál de estas experiencias pertenece a Roblox?',a:['Blox Fruits','Mario Kart','Animal Crossing','Gran Turismo'],c:0,category:'gaming'},
            {q:'En Roblox, ¿qué representa normalmente un avatar?',a:['Al jugador dentro de la experiencia','Una contraseña','El servidor completo','Una moneda'],c:0,category:'gaming'},
            {q:'¿Cómo se llama la protagonista humana de El Asombroso Circo Digital?',a:['Pomni','Ragatha','Gangle','Zooble'],c:0,category:'gaming'},
            {q:'En El Asombroso Circo Digital, ¿quién actúa como maestro de ceremonias del circo?',a:['Caine','Jax','Kinger','Bubble'],c:0,category:'gaming'},
            {q:'¿Cuál de estos personajes de El Asombroso Circo Digital tiene apariencia de conejo?',a:['Jax','Kinger','Pomni','Gangle'],c:0,category:'gaming'},
            {q:'¿Cuál de estos personajes de El Asombroso Circo Digital lleva una máscara teatral?',a:['Gangle','Jax','Caine','Kinger'],c:0,category:'gaming'},
            {q:'¿Cuál de estos personajes de El Asombroso Circo Digital tiene temática de pieza de ajedrez?',a:['Kinger','Pomni','Ragatha','Zooble'],c:0,category:'gaming'},
            {q:'¿Cómo se llama la muñeca de trapo de El Asombroso Circo Digital?',a:['Ragatha','Pomni','Gangle','Bubble'],c:0,category:'gaming'}
          ];
          for(const q of gamer){const k=q.q.trim().toLowerCase(); if(seen.has(k)) throw new Error(`Duplicate gamer question: ${q.q}`); seen.add(k);clean.push(q);}
          const bad=clean.filter(x=>!x||typeof x.q!=='string'||!Array.isArray(x.a)||x.a.length!==4||!Number.isInteger(x.c)||x.c<0||x.c>3||new Set(x.a.map(v=>String(v).trim().toLowerCase())).size!==4);
          if(bad.length) throw new Error(`Invalid=${bad.length}`);
          fs.writeFileSync('questions.js','const questions = '+JSON.stringify(clean,null,2)+';\n');
          console.log(`Added ${gamer.length} Gamer questions; validated ${clean.length} unique questions`);
          NODE
      - name: Commit questions.js
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add questions.js
          git diff --cached --quiet && exit 0
          git commit -m "Add validated Mundo Gamer question pack"
          git push origin HEAD:r60-preview
